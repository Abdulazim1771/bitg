name: release

# Faqat versiya tegi (v0.2.0) qo'yilganda: MSI quriladi, (sertifikat bo'lsa) imzolanadi va GitHub Release'ga yuklanadi.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Versiya tegdan va Cargo.toml'dan bir xilmi
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "Teg $tag, Cargo.toml $cargo" }
          "VERSION=$tag" >> $env:GITHUB_ENV
      - run: cargo test --workspace --locked
      - name: MSI
        shell: pwsh
        env:
          BITG_SIGN_PFX: ${{ secrets.BITG_SIGN_PFX }}
          BITG_SIGN_PFX_PASSWORD: ${{ secrets.BITG_SIGN_PFX_PASSWORD }}
        run: ./installer/build.ps1 -Version $env:VERSION
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/bitg-$env:VERSION-x64.msi dist/bitg-$env:VERSION-x64.msi.sha256 `
            --title "bitg $env:VERSION" --generate-notes --verify-tag
